name: autolab-nightly

# Armory's autonomous self-improvement loop (the productized AutoLab; conforms to
# Darwin's DSIP — see dsip.json). Runs nightly on GitHub's runners. Two engines:
#   • DETERMINISTIC (always, $0 LLM): crawl live registries → dedup-promote → rebuild → validate.
#   • CLAUDE-POWERED (when ANTHROPIC_API_KEY secret is set): `claude -p` headless does
#     open-ended DISCOVERY — finds NEW sources (Performance-Novelty), writes adapters, researches.
# Every candidate passes the Hamel test-gate (functional + behavioral) BEFORE it enters the repo,
# so skills don't drift/go stale. `[skip ci]` on the bot's own commit prevents a trigger loop.
#
# REMOTE OPTIONS to drive this (chairman: "claude -p / dispatch / cron, remote not just local"):
#   1. This GH Actions cron (default — remote, scheduled, no laptop needed).
#   2. Set repo secret ANTHROPIC_API_KEY → the claude -p discovery step activates.
#   3. Anthropic Managed Agents / Claude Code "work routines" can call this same flow.
on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC (crons run on the default branch only)
  workflow_dispatch:
    inputs:
      claude_research:
        description: "Run the claude -p discovery step (needs ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: autolab
  cancel-in-progress: false

jobs:
  autolab:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 0. CLAUDE-POWERED DISCOVERY (open-ended; only when the key is present).
      #    Headless Claude Code researches NEW sources and writes adapters. Fault-isolated:
      #    if it fails or the key is absent, the deterministic loop below still runs.
      - name: Claude-powered discovery (claude -p, headless)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Install Claude Code headless and VERIFY it is on PATH (no silent 2>/dev/null that hides real errors).
          npm i -g @anthropic-ai/claude-code || { echo "::warning::claude-code install failed — skipping discovery"; exit 0; }
          claude --version || { echo "::warning::claude binary not found after install — skipping discovery"; exit 0; }
          # Run the day's Plan of Record (ingest/daily-por.md) headless. Capture output so the REAL
          # failure reason is visible instead of a generic 'did not complete' warning.
          set +e
          claude -p "$(cat ingest/daily-por.md)" --dangerously-skip-permissions --max-turns 40 --output-format text 2>&1 | tee /tmp/discovery.log
          code=${PIPESTATUS[0]}
          set -e
          if grep -qiE "credit balance is too low|insufficient.*credit|quota" /tmp/discovery.log; then
            echo "::error::claude -p BLOCKED — the ANTHROPIC_API_KEY repo secret has NO CREDITS. Claude Code IS instantiated headless and authenticates, but the nightly self-improvement routine cannot run until credits are topped up (or a funded key is set as the ANTHROPIC_API_KEY secret). The deterministic crawl loop below still runs. >>> CHAIRMAN UNBLOCK <<<"
          elif [ "$code" -ne 0 ]; then
            echo "::warning::claude -p discovery exited $code — see step log above; deterministic loop continues."
          else
            echo "claude -p discovery completed."
          fi

      # 1. DETERMINISTIC crawl of the refreshable live-API registries (fault-isolated).
      - name: Crawl refreshable API sources
        run: |
          for src in smithery glama mcpso; do
            echo "::group::crawl-$src"
            node "ingest/crawl-$src.mjs" --apply || echo "::warning::crawl-$src failed — skipping this source"
            echo "::endgroup::"
          done

      # 2. TEST-GATE every freshly-crawled stub BEFORE it can be promoted (Hamel pyramid:
      #    functional schema + behavioral usability). A source that fails is skipped, not landed.
      - name: Test-gate new stubs (Hamel — before promote)
        run: |
          for dir in incoming/smithery incoming/glama incoming/mcpso; do
            [ -d "$dir" ] || continue
            if node ingest/test-gate.mjs "${dir#./}" ; then
              node ingest/promote.mjs --from "$dir" --to brain/components --apply || true
            else
              echo "::warning::$dir failed the test-gate — NOT promoted (prevents drift/stale entries)"
            fi
          done

      # 3. Recompute the catalog index.
      - name: Rebuild catalog.json
        run: node ingest/catalog.mjs

      # 3a. FILL IN THE MISSING STARS. Newly-crawled rows arrive with no signal, which leaves them
      #     honestly unranked. GitHub publishes the number; we just have to ask. GraphQL aliases ~100
      #     repos per request at ONE rate-limit point, so the whole backlog is a few hundred points of
      #     a 5,000/hour budget. Only rows that ARE a repo get its stars — a file inside a repo has not
      #     earned its parent's count. Then push the numbers back into the brain markdown (the source
      #     of truth) and rebuild, or the NEXT run's rebuild silently reverts every star fetched here.
      - name: Backfill stars + persist to the brain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/backfill-stars.mjs --apply || echo "::warning::star backfill failed — continuing"
          node scripts/persist-signals-to-brain.mjs --apply || echo "::warning::persist-to-brain failed — continuing"
          node ingest/catalog.mjs

      # 3b. Keep tabs on the upstream source repos (refresh repos/status.json staleness).
      #     Fault-isolated; uses the runner's GITHUB_TOKEN for a higher rate limit.
      - name: Refresh source-repo watchlist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ingest/crawl-repos.mjs || echo "::warning::crawl-repos failed — continuing"

      # 4. HARD GATES — schema validation AND the full-catalog Hamel gate. If either fails,
      #    do NOT commit; the repo stays at the last-known-good state (no-regression, DSIP eval gate).
      - name: Validate + test-gate (hard, no-regression)
        run: |
          node ingest/validate.mjs
          node ingest/test-gate.mjs

      # 5. Commit + push only if something changed. Append one audit line.
      - name: Commit growth if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "autolab: no net-new components this run."
            exit 0
          fi
          TOTAL=$(node -e "console.log(require('./catalog.json').counts.total)")
          git config user.name "armory-autolab[bot]"
          git config user.email "noreply@anthropic.com"
          echo "- $(date -u +%Y-%m-%dT%H:%MZ) — autolab refresh: catalog now ${TOTAL} components (gate: PASS)" >> AUTOLAB-LOG.md
          git add -A
          git commit -m "chore(autolab): nightly self-improve refresh → ${TOTAL} components [skip ci]"
          git push
