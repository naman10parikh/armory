name: crawl

# Recursively-self-improving loop, step 1: crawl external sources into incoming/
# stubs, then open a PR for human/CI verify -> promote. Manual + weekly.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Adapter name to run (must be registered in ingest/crawl.mjs ADAPTERS)"
        required: true
        type: string
  schedule:
    # Weekly, Monday 06:00 UTC. Crons run on the default branch only.
    - cron: "0 6 * * 1"

# create-pull-request needs write to push the branch and open the PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # In CI we write real stubs (no --dry-run) into incoming/. The adapter to
      # run comes from the dispatch input, or "all" on the weekly schedule.
      - name: Crawl sources into incoming/
        run: |
          SRC="${{ github.event.inputs.source }}"
          node ingest/crawl.mjs --source "${SRC:-all}" --apply

      # Validate that whatever landed still parses against the contract before we
      # bother opening a PR (fails loud if an adapter emits malformed frontmatter).
      - name: Sanity-check existing engrams still validate
        run: node ingest/validate.mjs

      - name: Open PR with new stubs
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "crawl: new engram stubs for verify -> promote"
          branch: crawl/incoming-stubs
          delete-branch: true
          title: "crawl: new engram stubs (auto)"
          body: |
            Automated crawl produced new stubs under `incoming/`.

            Next: a reviewer (or the promote workflow) verifies links and runs
            `node ingest/promote.mjs --from incoming/<source> --to brain/components --apply`
            to land the valid, unique ones in `components/`.
          labels: crawl, automated
