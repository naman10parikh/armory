name: ci

# The center testing suite — the gate everything passes before it ships (chairman:
# "only once it passes those gates, then it can go out"). Runs on every push + PR.
# Layers: zero-dep unit/contract/chaos (node:test) → schema validate → Hamel
# functional+behavioral gate → armory-mcp build + vitest. Red = no ship.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # L1 unit + contract + chaos + integration (zero-dep, fast, reliable). Enumerated,
      # not `node --test ingest/` — directory-glob behavior varies across Node versions,
      # and we must NOT auto-run test-gate.mjs here (it's the separate Hamel step below).
      - name: Unit + contract + chaos + integration (node:test)
        run: node --test ingest/test-pyramid.test.mjs ingest/integration.test.mjs ingest/tested.test.mjs ingest/shelf.test.mjs ingest/credit.test.mjs

      # Hard schema gate — every component honors the frontmatter contract.
      - name: Schema validate
        run: node ingest/validate.mjs

      # Hamel test-gate — functional (L1) + behavioral (L2) anti-drift over the catalog.
      - name: Hamel test-gate (functional + behavioral)
        run: node ingest/test-gate.mjs

      # Catalog freshness — catalog.json must equal a fresh rebuild (folded in from the
      # retired catalog.yml). generated_at is normalized; only structural drift fails.
      - name: Catalog freshness (no stale catalog.json)
        run: |
          node ingest/catalog.mjs
          norm() { sed 's/"generated_at": *"[^"]*"/"generated_at": "X"/'; }
          if git cat-file -e HEAD:catalog.json 2>/dev/null; then
            if ! diff <(norm < catalog.json) <(git show HEAD:catalog.json | norm) >/dev/null; then
              echo "::error::catalog.json is stale — run 'node ingest/catalog.mjs' and commit the result."; exit 1
            fi
          fi

      # Catalog size: GitHub refuses a file over 100 MB. Warns at 80 MB, fails at 95 MB (docs/CATALOG-SIZE.md).
      - name: Catalog size (warn at 80 MB, fail at 95 MB)
        run: node scripts/catalog-size.mjs

      # The design check: no em dash in text a person reads on the site (the chairman's checklist, item 45),
      # meaning JSX text and string literals under web/src. Comments, patterns and a lone "no value" dash pass.
      - name: Site design check (no em dash in text a person reads)
        run: node web/scripts/design-check.mjs && node --test web/test/design-check.test.mjs

      # Armory's own server: typecheck/build + vitest.
      - name: armory-mcp build + tests
        working-directory: armory-mcp
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      # Agentic "as a user" E2E (the chairman's final test) — build the CLI, then drive it
      # exactly as an agent/human would (search, no-match, unknown-command) and assert
      # behavior + exit codes + engram-free/grammatical help. Red = no ship.
      - name: CLI build + agentic user E2E
        run: |
          cd cli && npm install --no-audit --no-fund && npm run build && cd ..
          node --test cli/test/agentic-user.test.mjs

      # A new user installs the packages, not a clone (CP138 T50: both failed outside one). Pack the CLI and
      # the MCP server, install the tarballs into a throw-away prefix with an empty HOME, then run search,
      # rank, install --dry-run, init and an MCP session from there. Publishes nothing.
      - name: Fresh install from the packed tarballs
        run: bash scripts/fresh-install-check.sh

      # The site's catalog step keeps every field the pages read (a dropped `title` left the -2 heading, CP143),
      # and the lists and replies print that title while links and install commands keep the slug. Alternatives
      # never match two rows on their own type or component (CP138 PR G).
      # The tests import the TypeScript directly, which needs Node 22's type stripping; last, so the steps above
      # stay on Node 20.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Site catalog step (node:test)
        run: node --experimental-strip-types --test web/test/normalize.test.mjs web/test/title.test.mjs web/test/alternatives.test.mjs web/test/note-body.test.mjs
