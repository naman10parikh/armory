<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">armory --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: armory [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Armory: where agents gear up. Search and install harness components.</text>
<text x="24" y="146" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  -V, --version                    output the version number</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  -h, --help                       display help for command</text>
<text x="24" y="226" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  search [options] &lt;query&gt;         Keyword-search components by name +</text>
<text x="24" y="286" fill="#d8d3c8" xml:space="preserve">                                   description + tags, enriched with the</text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">                                   Universal score; sliceable by component +</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">                                   domain.</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  get &lt;name&gt;                       Print the full component markdown.</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  install [options] &lt;name&gt;         Fetch a component and install it into your</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                                   coding harness</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">                                   (claude/cursor/codex/opencode/gemini).</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">  init [options]                   Wire the Armory MCP server into your coding</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">                                   harness (one line, any harness).</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  submit [options]                 Validate a component file's frontmatter and</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">                                   copy it into incoming/.</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  list [options]                   Show counts and component names, optionally</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">                                   filtered by type.</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  rank [options]                   Rank open-source building blocks by</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                                   Universal score (or another axis), sliceable</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
